description: Democracy Works is a nonpartisan 501(c)(3) civic technology nonprofit, founded in 2010, that
  provides Americans with the guidance they need to vote in every election. Its Elections API delivers
  comprehensive federal, state, county and municipal election data — dates, deadlines, registration and
  voting methods, contests, candidates, ballot measures, endorsements and polling locations — keyed to
  Open Civic Data IDs and used by search, social and AI platforms including TikTok, Meta, Perplexity and
  Anthropic. It also runs TurboVote and co-runs the Voting Information Project with 40+ states.
