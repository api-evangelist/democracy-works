openapi: 3.2.0
info:
  title: Democracy Works Voting Locations API
  version: '2.0'
  description: '# Introduction


    The Democracy Works Elections API provides your application with comprehensive elections data and voting guidance, surfacing our unparalleled coverage of upcoming local, state, and federal elections.'
servers:
- url: https://api.democracy.works/v2
tags:
- name: Voting Locations
paths:
  /voting-locations:
    get:
      operationId: getVotingLocations
      summary: Voting Locations
      description: '### Address arguments


        An address may be supplied in one of two ways:


        - **As a single string**, via `address`.

        - **As components**, via `addressStreet`, `addressCity`, `addressState`,

        and `addressZip`. All four component parameters must be present, and

        `addressUnitNumber` may optionally be added.


        All requests must include an address as single string or with all required

        components (preferred).


        ```bash

        # Address as a single string

        curl \

        --get \

        --header "X-API-KEY: $YOUR_API_KEY" \

        --data-urlencode address="20 Jay Street Brooklyn NY 11201" \

        --data-urlencode publishStatus=prepublished \

        https://api.democracy.works/v2/voting-locations

        ```


        ```bash

        # Address as components

        curl \

        --get \

        --header "X-API-KEY: $YOUR_API_KEY" \

        --data-urlencode addressStreet="20 Jay Street" \

        --data-urlencode addressCity=Brooklyn \

        --data-urlencode addressState=NY \

        --data-urlencode addressZip=11201 \

        --data-urlencode addressUnitNumber="Unit 410" \

        --data-urlencode publishStatus=prepublished \

        https://api.democracy.works/v2/voting-locations

        ```'
      parameters:
      - in: query
        name: address
        required: false
        schema:
          type: string
          description: The full street address as a single string. Required unless all of `addressStreet`, `addressCity`, `addressState`, and `addressZip` are provided.
          example: 20 Jay Street Brooklyn NY 11201
      - in: query
        name: addressStreet
        required: false
        schema:
          type: string
          description: The street portion of the address. Must be provided together with `addressCity`, `addressState`, and `addressZip`.
          example: 20 Jay Street
      - in: query
        name: addressCity
        required: false
        schema:
          type: string
          description: The city portion of the address. Must be provided together with `addressStreet`, `addressState`, and `addressZip`.
          example: Brooklyn
      - in: query
        name: addressState
        required: false
        schema:
          type: string
          description: The 2-letter postal abbreviation for the state. DC is also accepted. Must be provided together with `addressStreet`, `addressCity`, and `addressZip`.
          example: NY
      - in: query
        name: addressZip
        required: false
        schema:
          type: string
          description: The 5-digit ZIP code. Must be provided together with `addressStreet`, `addressCity`, and `addressState`.
          example: '11201'
      - in: query
        name: addressUnitNumber
        required: false
        schema:
          type: string
          description: Optional apartment, suite, or unit number. Used only with the address component parameters; it is silently ignored when sent alongside `address`.
          example: Unit 410
      - in: query
        name: publishStatus
        required: false
        schema:
          type: string
          example: prepublished
          default: published
          enum:
          - published
          - prepublished
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  election:
                    $ref: '#/components/schemas/votingLocationElection'
                  otherElections:
                    type: array
                    items:
                      $ref: '#/components/schemas/votingLocationElection'
                  normalizedInput:
                    $ref: '#/components/schemas/normalizedAddress'
                  state:
                    $ref: '#/components/schemas/state'
                  votingLocations:
                    type: array
                    items:
                      $ref: '#/components/schemas/votingLocation'
                  earlyVoteSites:
                    type: array
                    items:
                      $ref: '#/components/schemas/votingLocation'
                  dropOffLocations:
                    type: array
                    items:
                      $ref: '#/components/schemas/votingLocation'
              example:
                election:
                  id: 36546cc9-aafb-466b-b92a-b91674eeb091
                  name: New York General Election
                  electionDay: '2025-11-04'
                  ocdDivisionId: ocd-division/country:us/state:ny
                otherElections: []
                normalizedInput:
                  line1: 20 Jay St
                  line2: null
                  unit_number: null
                  unit_label: null
                  city: Brooklyn
                  state: NY
                  zip: '11201'
                state:
                  name: Hawaii
                  electionAdministrationBody:
                    electionNoticeText: null
                    electionNoticeUrl: null
                    votingLocationFinderUrl: https://elections.hawaii.gov/voter-service-centers-and-places-of-deposit/
                votingLocations:
                - uuid: 05bf2123-143c-4ad5-8473-37959b147240
                  address:
                    locationName: Farragut Comm Ctr
                    line1: 228 York St
                    line2: null
                    city: Brooklyn
                    state: NY
                    zip: '11201'
                  latitude: 40.700687
                  longitude: 73.98139
                  startDate: '2025-11-04'
                  endDate: '2025-11-04'
                  pollingHours: 'Tue, Nov 4: 6:00 am - 9:00 pm'
                  notes: Conference Room G
                  sources:
                  - name: Democracy Works
                earlyVoteSites:
                - uuid: f86db89d-8940-45d4-9144-6c9ec11171a8
                  address:
