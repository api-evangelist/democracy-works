                    Sun, Oct 26: 9:00 am - 5:00 pm

                    Mon, Oct 27: 9:00 am - 5:00 pm

                    Tue, Oct 28: 10:00 am - 8:00 pm

                    Wed, Oct 29: 10:00 am - 8:00 pm

                    Thu, Oct 30: 9:00 am - 5:00 pm

                    Fri, Oct 31: 8:00 am - 4:00 pm

                    Sat, Nov 1: 9:00 am - 5:00 pm

