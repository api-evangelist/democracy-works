openapi: 3.2.0
info:
  title: Democracy Works Elections API
  version: '1.0'
  description: 'Operations tagged Elections across 2 of this provider''s published API definitions: democracy-works-api-v1-openapi.json, democracy-works-api-v2-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- description: Democracy Works API
  url: https://api.democracy.works
- url: https://api.democracy.works/v2
tags:
- name: Elections
paths:
  /elections/upcoming:
    get:
      summary: Upcoming elections
      description: 'An “upcoming” Election is one that is in our system and the date is in

        the future, including the day that the request is made. Both statewide

        and local Elections are part of this data set. We define a statewide

        Election as any election where all voters in the state have something on

        the ballot or any federal congressional election. These generally end in

        a two-letter state code. All other elections are considered local.


        There are two ways to request Upcoming Elections:


        1. all at once

        2. one (or more) OCD-ID(s) at a time


        Be sure to include the `Accept` header because the default

        `Content-Type` is the lesser known EDN (application/edn). The two

        `Content-Type`s supported are `application/json` and `application/edn`.


        ### All Upcoming Elections


        Returns a list of all upcoming elections.


        An example response is available, and all field definitions are in the

        Upcoming Elections API Reference.


        ```bash

        curl -H "Accept: application/json" \

        -H "Authorization: apikey $YOUR_API_KEY" \

        https://api.democracy.works/elections/upcoming

        ```


        ### Upcoming Elections by OCD-ID


        Returns a list of all upcoming elections for the provided OCD-ID(s).

        Same as the above, but filtered.


        ```bash

        curl -H "Accept: application/json" \

        -H "Authorization: apikey $YOUR_API_KEY" \

        "https://api.democracy.works/elections/upcoming?district-divisions=ocd-division/country:us/state:il/place:chicago"

        ```'
      parameters:
      - in: query
        name: district-divisions
        schema:
          type: string
        description: 'A **comma-separated** list, supplied as a string, of OCD IDs that will

          return upcoming elections only for the OCD IDs provided.

          '
      - in: query
        name: language
        description: 'By default, responses include instructions in English. At this time we

          support 2 languages: English (`en`) and Spanish (`es`). Use this parameter to receive

          instructions in a single language.


          You may also use `all` to receive instructions in both English and

          Spanish. Note that this changes the structure of the response; any

          field which supports localized instructions will be an object keyed by all

          supported languages, exemplified by the following JSON fragment:


          ```

          {"instructions": {"en": "...", "es": "..."}}

          ```

          '
        schema:
          type: string
          enum:
          - en
          - es
          - all
      - in: query
        name: qa-status
        schema:
          type: string
          default: complete
          enum:
          - incomplete
          - complete
          - all
        description: 'See [QA Status](#tag/QAStatus) for a more in-depth discussion of the

          meaning of this parameter.

          '
      - in: header
        name: Accept
        schema:
          type: string
          enum:
          - application/json
          - application/edn
      - in: header
        name: Authorization
        schema:
          type: string
          example: apikey $YOUR_API_KEY
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpcomingElectionsResponse'
      tags:
      - Elections
      operationId: getElectionsUpcoming
      x-operation-id-source: derived
    servers:
    - description: Democracy Works API
      url: https://api.democracy.works
  /elections:
    get:
      operationId: getElections
      summary: Elections
      description: 'This endpoint has election-specific dates and deadlines, URLs for voters to get more information and take action, and detailed guidance in both English and Spanish. The information included reflects the voter registration and voting methods available in the state for that election, such as online, in-person, and by-mail registration as well as by-mail, in-person, and early voting. The election also contains some information from the related state authority. The default is to return all elections, though you can limit the response to upcoming elections through the use of the start date parameter. Elections are returned sorted chronologically by election date.


        After an election is confirmed to be occurring, Democracy Works surfaces information about an election as details become available. An election’s guidance phase describes the state of the currently available guidance.


        A `past` election is an election whose election date is in the past. An `expected` election is an upcoming election that is expected to occur but for which Democracy Works has not yet published specific guidance for. A `not currently expected` election is an election that Democracy Works expect to happen but will not publish guidance for. An `active` election is an upcoming election for which Democracy Works has published specific guidance.


        Elections are returned sorted chronologically by election date.


        Supports the following standard parameters: see __Pagination__, __Localization__, __Content Formatting__, and __Fields__.


        ### Ballot Measure Information


        Information about measures on the ballot will include:

        - All federal ballot measures

        - All statewide ballot measures

        - Local ballot measures in the top 100 cities by population


        Ballot measure information is not included in the default response for an election. For ballot measure information to be included with the response, include the `includeBallotData` parameter with a value of `true`.


        Ballot data is sourced from Ballotpedia.


        ### Candidate and Contest Information


        Information about contests and candidates on the ballot will include:

        - All federal contests and candidates, including senate and house of representatives

        - All state contests and candidates, including governor, treasurer, secretary of state, state legislative seats, state supreme court, district court, and court of appeals

        - Local contests and candidates including mayor, county judge, county clerk, commissioners, and city councils in the top 100 cities by population, plus school board elections in 475 districts

        - Note that local coverage may be limited by mapping constraints.


        Ballot data is sourced from Ballotpedia.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: address
        in: query
        schema:
          type: string
          description: The full street address as a single string. Required unless all of `addressStreet`, `addressCity`, `addressStateCode`, and `addressZip` are provided.
          example: 813%20Howard%20Street%20Oswego%20NY%2013126
        required: false
      - name: addressStreet
        in: query
        schema:
          type: string
          description: The street portion of the address. Must be provided together with `addressCity`, `addressStateCode`, and `addressZip`.
          example: 813%20Howard%20Street
        required: false
      - name: addressCity
        in: query
        schema:
          type: string
          description: The city portion of the address. Must be provided together with `addressStreet`, `addressStateCode`, and `addressZip`.
          example: Oswego
        required: false
      - name: addressStateCode
        in: query
        schema:
          type: string
          description: The 2-letter postal abbreviation for the state. DC is also accepted. Must be provided together with `addressStreet`, `addressCity`, and `addressZip`.
          example: NY
        required: false
      - name: addressZip
        in: query
        schema:
          type: string
          description: The 5-digit ZIP code. Must be provided together with `addressStreet`, `addressCity`, and `addressStateCode`.
          example: '13126'
        required: false
      - name: addressZip4
        in: query
        schema:
          type: string
          description: The optional 4-digit ZIP+4 extension. May be added alongside `addressStreet`, `addressCity`, `addressStateCode`, and `addressZip`.
          example: '9029'
        required: false
      - name: stateCode
        in: query
        schema:
          type: string
          description: The 2-letter postal code to get elections within a respective state. DC is accepted as well.
          example: CA
        required: false
      - name: ocdId
        in: query
        schema:
          type: string
          description: The OCD-ID(s) of a political division; elections that apply to a voter in this political division will be returned.  This parameter may be provided multiple times to return all elections with any of the OCD IDs provided.
          example: ocd-division%2Fcountry%3Aus%2Fstate%3Any%2Fcounty%3Akings
        required: false
      - name: startDate
        in: query
        schema:
          type: date
          description: The earliest date to get elections for, inclusive, in UTC ISO 8601 format.
          example: '2023-01-01'
        required: false
      - name: endDate
        in: query
        schema:
          type: date
          description: The latest date to get elections for, inclusive, in UTC ISO 8601 format.
          example: '2023-01-02'
        required: false
      - name: electionTypes
        in: query
        schema:
          type: string
          description: The election types (options are presidentialPrimary, state, stateSenate, stateHouse, congressional, senate, county, subCounty, municipal, subMunicipal, school, and special). Comma-separated list.
        required: false
      - name: includeQuestionAndAnswer
        in: query
        schema:
          type: boolean
          description: Whether Question and Answer content should be included for each returned election. Defaults to false if not specified. Response fields are formattable with the __[content formatting](#section/Standard-Parameters/Content-Formatting)__ standard parameter.
          example: true
        required: false
      - name: includeBallotData
        in: query
        schema:
          type: boolean
          description: Whether ballot data (ballot measures, candidates, and contests) should be included for each returned election. Defaults to false if not specified.
          example: true
        required: false
      responses:
        '200':
          description: Elections fetched by query.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      elections:
                        type: array
                        items:
                          $ref: '#/components/schemas/election'
                      statewideOnly:
                        type: boolean
                        description: Unable to determine elections more granular than the state level.  Only state level elections returned.
                  pagination:
                    $ref: '#/components/schemas/pagination'
              examples:
                sampleElectionsResponse:
                  $ref: '#/components/examples/elections'
        '400':
          $ref: '#/components/responses/badRequestError'
        '413':
          $ref: '#/components/responses/contentTooLargeError'
        '429':
          $ref: '#/components/responses/tooManyRequestsError'
        '500':
          $ref: '#/components/responses/internalServerError'
      tags:
      - Elections
    servers:
    - url: https://api.democracy.works/v2
components:
  schemas:
    OnlineRegistrationMethod:
      type: object
      properties:
        type:
          type: string
          enum:
          - online
          description: 'Indicates that online voter registration is an option in the state. The sections following provide the state-specific requirements. This field and fields associated with online voter registration are only populated in states where it is available.

            '
        instructions:
          type: object
          description: 'Lists the state-specific requirements for registering to vote online.

            '
          properties:
            registration:
              description: 'Provides the identification requirements and other instructions for registering to vote online.

                '
              $ref: '#/components/schemas/LocalizedField'
        supports-iframe:
          type: boolean
          description: 'Indicates whether the state online voter registration site can be iframed. `true`: can be iframed, `false`: cannot be iframed.

            '
        deadline-online:
          type: string
          format: date-time
          description: 'Provides the deadline date for registering online to vote for the particular election. This [timestamp should be interpreted as a date](#tag/DateAsTimestamp).

            '
        url:
          type: string
          format: uri
          description: 'Provides the link to the state online voter registration system.

            '
    DistrictDivision:
      type: object
      properties:
        ocd-id:
          type: string
          example: ocd-division/country:us/state:nc/sldl:1
          description: 'The political division of the election. Represented as an Open Civic Data Identifier. Voters within these political jurisdictions are covered by this election.

            '
        voter-registration-authority-level:
          type: string
        election-authority-level:
          type: string
        voting-methods:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/ByMailVotingMethod'
            - $ref: '#/components/schemas/EarlyVotingVotingMethod'
            - $ref: '#/components/schemas/InPersonVotingMethod'
        voter-registration-methods:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/ByMailRegistrationMethod'
            - $ref: '#/components/schemas/ElectionDayRegistrationMethod'
            - $ref: '#/components/schemas/InPersonRegistrationMethod'
            - $ref: '#/components/schemas/OnlineRegistrationMethod'
        primary-voting-method-source:
          type: string
    LocalizedField:
      oneOf:
      - type: object
        properties:
          en:
            type: string
            description: English text
          es:
            type: string
            description: Spanish text
      - type: string
        description: Localized text dependent on the `language` parameter
    EarlyVotingVotingMethod:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - early-voting
          description: 'Indicates that early voting is an option for the particular election. The sections following provide the state-specific requirements. This field and fields associated with early voting are only populated in states where it is available.

            '
        primary:
          type: boolean
          description: 'Indicates whether voting early is the primary voting method for the particular election or not. `true`: primary voting method; `false`: not primary voting method.

            '
        excuse-required:
          type: boolean
          description: 'Indicates whether you need an excuse to vote early. `true`: excuse required; `false`: excuse not required.

            '
        start:
          type: string
          format: date-time
          description: 'Indicates the start date for early voting for the particular election. Early voting dates often vary within a state. This date can either be the earliest date or the latest date any jurisdiction is required to begin. This [timestamp should be interpreted as a date](#tag/DateAsTimestamp).

            '
        end:
          type: string
          format: date-time
          description: 'Indicates the end date for early voting for the particular election. Early voting dates often vary within a state. This date can either be the earliest day or the latest date any jurisdiction is required to end. This [timestamp should be interpreted as a date](#tag/DateAsTimestamp).

            '
        alias:
          type: string
          enum:
          - early-voting
          - absentee-in-person
          description: 'Default is empty, meaning election officials in the state use the term "early voting" or the value can explicitly list `early-voting`. If the value is `absentee-in-person` that means election officials in the state use the term "absentee in person". We don''t distinguish these two in the data because they are functionally equivalent.

            '
        exact-dates:
          type: boolean
          deprecated: true
          description: Deprecated field as we reconsider date display.
        url:
          type: string
          format: uri
          description: 'If there is a website that provides information about the election or how to participate, we will provide it here. This field is often an election-specific URL, though we may include voter information portals.

            '
    UpcomingElectionsResponse:
      type: object
      required:
      - date
      - description
      - type
      - id
      - qa-status
      properties:
        description:
          type: string
          description: 'Displayable name for the election. Includes the political division affected by the election and the election type. Descriptions can also provide information on whether the election will be conducted via mail ballot if elections are not typically conducted that way in the state.

            '
        date:
          type: string
          format: date-time
          description: 'Day of the election. This [timestamp should be interpreted as a date](#tag/DateAsTimestamp).

            '
          example: '2022-11-08T00:00:00Z'
        district-divisions:
          type: array
          items:
            $ref: '#/components/schemas/DistrictDivision'
        type:
          type: string
          enum:
          - congressional
          - county
          - municipal
          - presidential-primary
          - school
          - state
          - state-house
          - state-senate
          - sub-municipal
          description: The election type
        source:
          type: object
          description: 'Information about how the Election was researched. For internal use only.

            '
          properties:
            type:
              type: string
            notes:
              type: string
            date:
              type: string
              format: date-time
        polling-place-url:
          type: string
          format: uri
          description: Provides a link to the state's polling place lookup page.
        polling-place-url-shortened:
          type: string
          format: uri
          example: https://tvote.org/abcd123
          description: Shortened link for the state's polling place lookup page.
        qa-status:
          type: string
          enum:
          - complete
          - incomplete
          - none
          description: 'Only `complete` elections are shown in the API by default, but early access to `incomplete` data is available. See [QA Status](#tag/QAStatus) for more discussion.

            '
        id:
          type: string
          description: 'Unique election ID for internal use only. This value may change.

            '
        population:
          type: integer
          description: 'Provides the affected population number for the given election using Census data, when available.

            '
        website:
          type: string
          format: uri
          description: 'Provides a link to additional information on the upcoming election, when available.

            '
    InPersonVotingMethod:
      type: object
      required:
      - type
      - primary
      properties:
        type:
          type: string
          enum:
          - in-person
          description: 'Indicates that voting in-person is an option for the particular election. The sections following provide the state-specific requirements. This field, and fields associated with voting in-person, are not available in Oregon.

            '
        primary:
          type: boolean
          description: 'Indicates whether voting in person is the primary voting method for the particular election or not. `true`: primary voting method; `false`: not primary voting method.

            '
        excuse-required:
          type: boolean
          description: "Indicates whether you need an excuse to vote in-person. `true`:\n  excuse required; `false`: excuse not required.\n"
        instructions:
          type: object
          description: 'Lists the state-specific requirements for voting in-person. See [our notes on instruction fields](#tag/Instructions) for more information on interpreting these fields.

            '
          properties:
            voting-id:
              description: 'Provides the identification requirements and other instructions for voting in-person.

                '
              $ref: '#/components/schemas/LocalizedField'
    ElectionDayRegistrationMethod:
      type: object
      properties:
        type:
          type: string
          enum:
          - election-day
          description: 'Indicates whether voter registration is available for the particular election at voting locations.

            '
    InPersonRegistrationMethod:
      type: object
      properties:
        type:
          type: string
          enum:
          - in-person
          description: 'Indicates that in-person voter registration is an option in the state. This field and fields associated with in-person voter registration are only populated in states where it is available.

            '
        start:
          type: string
          format: date-time
          description: 'This [timestamp should be interpreted as a date](#tag/DateAsTimestamp).

            '
        end:
          type: string
          format: date-time
          description: 'This [timestamp should be interpreted as a date](#tag/DateAsTimestamp).

            '
    ByMailRegistrationMethod:
      type: object
      properties:
        type:
          type: string
          enum:
          - by-mail
          description: 'Indicates that registering to vote by mail is an option for the particular election. The sections following provide the state-specific requirements. This field, and fields associated with registering to vote by mail are not available for elections in New Hampshire or North Dakota.

            '
        instructions:
          type: object
          description: 'Lists the state-specific signature block language and ID requirements for registering to vote by mail.

            '
          properties:
            signature:
              description: 'Provides the state-specific language for voters to affirm when they complete and sign their paper registration form. This language varies from state to state.

                '
              $ref: '#/components/schemas/LocalizedField'
            idnumber:
              description: 'Provides the state-specific identification requirements for registering to vote by mail.

                '
              $ref: '#/components/schemas/LocalizedField'
        acceptable-forms:
          type: array
          description: 'Lists the paper registration form accepted by the state.

            '
          items:
            type: object
            properties:
              name:
                type: string
                description: 'Display name for the state-accepted registration form. Most states accept the National Voter Registration Form (`nvrf`). Voters in Wyoming must use the state-specific registration form (`wy_reg`). This field is left blank in New Hampshire and North Dakota.

                  '
        deadline-received:
          type: string
          format: date-time
          description: 'Indicates that a by mail voter registration application must be received by the designated election office by the deadline date for the particular election. This [timestamp should be interpreted as a date](#tag/DateAsTimestamp).

            '
        deadline-postmarked:
          type: string
          format: date-time
          description: 'Indicates that a by mail voter registration applications must be postmarked by the deadline date for the particular election. This [timestamp should be interpreted as a date](#tag/DateAsTimestamp).

            '
        deadline-in-person:
          type: string
          format: date-time
          description: 'Indicates that a by mail voter registration must be delivered/completed in person (by the voter) by the deadline date for the particular election. This [timestamp should be interpreted as a date](#tag/DateAsTimestamp).

            '
        new-voter:
          type: string
    ByMailVotingMethod:
      type: object
      required:
      - type
      - primary
      properties:
        type:
          type: string
          enum:
          - by-mail
        primary:
          type: boolean
          description: 'Indicates whether voting by mail is the primary voting method for the particular election or not. `true`: primary voting method; `false`: not primary voting method.

            '
        ballot-request-form-url:
          $ref: '#/components/schemas/LocalizedField'
          description: 'URL for a form that a voter can use to request an absentee/by-mail ballot.

            '
        ballot-request-deadline-received:
          type: string
          format: date-time
          description: 'Indicates the date that a ballot request application must be received by the designated election official for the particular election. This [timestamp should be interpreted as a date](#tag/DateAsTimestamp).

            '
        ballot-return-deadline-postmarked:
          type: string
          format: date-time
          description: 'Indicates the date that a completed ballot must be postmarked by the voter for the particular election. This [timestamp should be interpreted as a date](#tag/DateAsTimestamp).

            '
        ballot-return-deadline-received:
          type: string
          format: date-time
          description: 'Indicates the date that a completed ballot must be received by the designated election official for the particular election. This [timestamp should be interpreted as a date](#tag/DateAsTimestamp).

            '
        ballot-return-deadline-in-person:
          type: string
          format: date-time
          description: 'Indicates the date that a completed ballot must be returned in-person by the voter at a designated election office/dropbox for the particular election. This [timestamp should be interpreted as a date](#tag/DateAsTimestamp).

            '
        vbm-alias:
          $ref: '#/components/schemas/LocalizedField'
          description: 'The name used by the jurisdiction to refer to voting by mail.

            '
        excuse-required:
          type: boolean
          description: 'Indicates whether you need an excuse to vote by-mail. `true`: excuse required; `false`: excuse not required.

            '
        acceptable-forms:
          type: array
          description: 'Lists the acceptable ballot request application form.

            '
          items:
            type: object
            properties:
              name:
                type: string
                description: 'For internal use only. Name for the ballot request application.

                  '
    pagination:
      type: object
      properties:
        totalRecordCount:
          type: number
          description: Total records found for the given query.
        currentPage:
          type: number
          description: The page of records returned.
        pageSize:
          type: number
          description: The number of records returned.
    election:
      description: A representation of an election.
      type: object
      required:
      - description
      - date
      - ocdId
      properties:
        ocdId:
          type: string
          description: Provides the [OCD-ID](https://opencivicdata.info/en/latest/ocdids.html) associated with the office.
        createdAt:
          type: string
          description: ISO 8601 timestamp of when the election was first created in Democracy Works' internal database.
        updatedAt:
          type: string
          description: ISO 8601 timestamp of when the election was last updated in Democracy Works' internal database.
        date:
          type: string
          description: Date of the election in YYYY-MM-DD format.
        description:
          type: string
          description: 'The election name which includes the jurisdiction affected by the election and a descriptor of the election type.


            `Localized`

            '
        type:
          type: string
          description: Provides the election type.
          enum:
          - congressional
          - county
          - municipal
          - presidentialPrimary
          - school
          - state
          - stateHouse
          - stateSenate
          - subMunicipal
          - subCounty
        pollingLocationUrl:
          type: string
          description: Lookup URL for voting location information. If an election is all-mail, this URL will link to information for election-specific dropbox locations.
        canonicalUrl:
          type: string
          description: 'Provides a URL to the Democracy Works data source for attribution purposes. Attribution allows voters to assess the reliability and provenance of election data and guidance.


            `Localized`

            '
        website:
          type: string
          description: 'Provides a URL for voters to access additional information on the upcoming election, when available.


            `Localized`

            '
        guidancePhase:
          type: string
          description: 'After an election is confirmed to be occurring, Democracy Works surfaces information about an election as details become available. An election’s guidance phase describes the state of the currently available guidance.

            '
          enum:
          - past
          - active
          - expected
          - not currently expected
        population:
          type: string
          description: Provides the affected population number for the given election using Census data or government data. This field will be null if the population is less than 5,000.
        voting:
          type: object
          properties:
            inPersonVotingAvailable:
              type: boolean
              description: Indicates whether an election has options to vote in person.
            mailBallotsSentAutomatically:
              type: boolean
              description: Indicates whether ballots are sent to eligible registered voters automatically in an election without voters having to request ballots themselves.
            early:
              type: object
              properties:
                url:
                  type: string
                  description: Provides website for voters to find out more about when and where to vote early in a specific election or provides general information about the early voting process if available.
                startDate:
                  type: string
                  description: Provides the date when early voting or absentee in person voting begins for the election in YYYY-MM-DD format if early voting or absentee in person voting is available in the election. If in person absentee voting starts as ballots are available, as opposed to a specific start date, this field will be blank and only voting.early.endDate will be returned.
                endDate:
                  type: string
                  description: Provides the date when early voting or absentee in person voting ends for the election in YYYY-MM-DD format if early voting or absentee in person voting is available in the election.
                varies:
                  type: boolean
                  description: Indicates whether early voting dates are consistent across locations and whether early voting is available every day between when early voting starts and when early voting ends.
            byMail:
              type: object
              properties:
                idInstructions:
                  type: string
                  description: Provides election-specific instructions for voters who choose to vote by mail.
                explainerUrl:
                  type: string
                  description: 'Provides a URL where voters can learn more about voting by mail.


                    `Localized`

                    '
                allMail:
                  type: object
                  properties:
                    ballotInfoUrl:
