context:
  note: >-
    Democracy Works is a 501(c)(3) nonprofit whose stated revenue model is "primarily
    charitable giving, with some earned revenue from product partnerships" (their own
    llms.txt). Contact-sales pricing here reflects a partnership model rather than a
    withheld rate card — but the practical effect on a developer is the same: no price can
    be known without a conversation, and no plan can be self-served.
supersedes:
  method: generated
  date: '2026-05-04'
  note: >-
    This file previously carried three invented tiers (Free 1,000 req/month, Professional
    100,000 req/month, Enterprise) written by an API Evangelist bulk sweep. Democracy Works
    publishes none of that. The scaffold has been removed rather than annotated, because a
    plausible fabricated rate card is worse than an honest zero.
