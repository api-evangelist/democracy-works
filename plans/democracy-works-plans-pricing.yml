description: >-
  Democracy Works publishes NO plans and NO prices for the Elections API. Access is sold
  through a partnership conversation: the product pages carry a "Request Pricing" call to
  action and the contract itself says "For pricing information and to obtain a test key,
  please contact us." plan_count is therefore 0 — a measured fact, not a missing file.
