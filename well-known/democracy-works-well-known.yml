specification: API Evangelist Well-Known Probe
specificationVersion: '0.1'
provider: Democracy Works
providerId: democracy-works
generated: '2026-09-07'
method: probed
source: live unauthenticated HTTPS GETs of /.well-known/* on every host this record knows
description: >-
  Probe of the five canonical /.well-known discovery documents plus both A2A agent-card
  paths across every Democracy Works host in this record: the registrable domain and www,
  the API base host, the legacy data portal host, and the developer documentation host.
  Nothing is served. NO WellKnown, SecurityTxt or AgentCard pointer is wired into apis.yml
  because no path returned a real document — this file records a measured absence.
notes:
  - >-
    data.democracy.works answers 200 for EVERY path, including nonsense ones: it is a
    Webflow catch-all that redirects to https://www.democracy.works/. Verified with a
    control probe of /zzz-garbage-path-xyz, which returned the identical body
    (md5 6c490738ce9cf569b59f7ebded4ef930, 129712 bytes). Every 200 below on that host is
    an SPA/marketing shell, not a document, and is recorded as a miss.
  - >-
    democracy.works and www.democracy.works return a genuine 404 body reading
    "Invalid .well-known request" — the edge handles the namespace and serves nothing.
  - >-
    api.democracy.works is AWS API Gateway behind CloudFront; unknown paths return a
    404 {"message":"Not Found"} and known paths without a key return 403 ForbiddenException.
