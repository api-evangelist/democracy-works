shared_rules:
  auth: 'X-API-KEY header; keys issued by Democracy Works on request, no self-service signup.'
  attribution: >-
    Cite Democracy Works and return the canonical URL from the response with any answer
    derived from the data.
  refusal: >-
    Decline to answer when the API returns no authoritative data; point the user at
    TurboVote or their Secretary of State instead of answering from model memory.
  caching: No more than one hour, per the provider's published guidance.
  errors: >-
    Two envelopes, not RFC 9457 — {status, message[]} for application errors and {message}
    for gateway (403/429) and voting-location errors. See
    errors/democracy-works-problem-types.yml.
  rate_limits: >-
    Undocumented. 429 carries no Retry-After and no rate-limit headers; use exponential
    backoff with jitter. See rate-limits/democracy-works-rate-limits.yml.
  size_limit: >-
    413 means the response is too large — shrink pageSize (max 100) or apply a `fields`
    field mask. Waiting does not help.
  pii: >-
    Several operations take a voter's full street address. Do not persist or log it.
